name: pocdantic-lab
services:
  postgres:
    image: postgres:18.6-trixie
    ports:
      - "127.0.0.1:55432:5432"
    environment:
      POSTGRES_USER: poc_admin
      POSTGRES_DB: poc
      POSTGRES_PASSWORD: ${LAB_POSTGRES_ADMIN_PASSWORD:?Run scripts/local_lab.py up first}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./config/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./.local/lab-tls:/cert-source:ro
    command:
      - sh
      - -c
      - >-
        cp /cert-source/postgres.crt /tmp/server.crt &&
        cp /cert-source/postgres.key /tmp/server.key &&
        chown postgres:postgres /tmp/server.crt /tmp/server.key &&
        chmod 600 /tmp/server.key &&
        exec docker-entrypoint.sh postgres
        -c ssl=on -c ssl_cert_file=/tmp/server.crt -c ssl_key_file=/tmp/server.key
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poc_admin -d poc"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
