[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "PoCdantic"
version = "0.1.0"
description = "Reusable identity-aware Pydantic AI PoC runtime"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic-ai-slim==2.55.0", "pydantic-settings>=2.15,<3", "httpx>=0.28,<1", "pyjwt[crypto]>=2.15,<3"]

[project.urls]
Repository = "https://github.com/mcteer/pocdantic"
Issues = "https://github.com/mcteer/pocdantic/issues"

[project.optional-dependencies]
google = ["pydantic-ai-slim[google]==2.55.0"]
openai = ["pydantic-ai-slim[openai]==2.55.0"]
anthropic = ["pydantic-ai-slim[anthropic]==2.55.0"]
logfire = ["pydantic-ai-slim[logfire]==2.55.0"]
server = ["fastapi>=0.143,<1", "uvicorn>=0.54,<1"]
postgres = ["psycopg[binary]>=3.2,<4"]

[dependency-groups]
browser = [
    "playwright>=1.63.0",
]
dev = ["pytest>=9.1,<10", "pytest-asyncio>=1.4,<2", "ruff>=0.17,<1"]

[project.scripts]
agent = "agent.cli:main"
pocdantic = "agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]
[tool.hatch.build.targets.wheel.force-include]
"config/agents.json" = "agent/default_agents.json"
"config/validation-suites.json" = "agent/validation/default_suites.json"

[tool.hatch.build.targets.sdist]
include = ["src/agent", "config", "compose.yaml", "scripts/local_lab.py", "scripts/provision_database.py", "README.md", "CONTRIBUTING.md", "pyproject.toml", "uv.lock"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
