# Explicitly enabled operational read; never runs from a pull request or CI test.
name: Supabase keepalive
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: supabase-keepalive
  cancel-in-progress: false
jobs:
  read:
    if: vars.SUPABASE_KEEPALIVE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: '0.12.5'
          python-version: '3.12'
      - run: uv sync --locked --no-dev --extra postgres
      - name: Read one constant over verified TLS
        env:
          SUPABASE_KEEPALIVE_DSN: ${{ secrets.SUPABASE_KEEPALIVE_DSN }}
          SUPABASE_KEEPALIVE_CA: ${{ secrets.SUPABASE_KEEPALIVE_CA }}
        run: timeout 30s uv run --no-sync python scripts/supabase_keepalive.py
