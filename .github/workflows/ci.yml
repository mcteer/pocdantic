name: Quality gates
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.12.5'
      - run: uv sync --locked --extra server --extra logfire --extra postgres --extra sandbox --extra google --extra openai --extra anthropic --group dev --group browser
      - run: python3 scripts/check_privacy.py --history
      - run: uv run python scripts/check_gates.py --all-features
      - run: uv run python scripts/check_gates.py --runtime-only
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run --group browser playwright install --with-deps webkit
      - run: uv run --group browser pytest -q
      - run: uv run python scripts/run_security_regression.py run
      - run: uv run agent validate run
      - run: uv run pytest -q tests/test_validation_runner.py::test_ten_repeatable_runs_under_budget tests/test_validation_report.py::test_ten_thousand_normalized_event_report_budget
      - run: uv run pytest -q tests/test_validation_readiness.py tests/test_validation_closeout.py
      - run: uv run agent demo
      - run: uv build
      - run: uv run python scripts/check_distribution.py

  onboarding:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: '0.12.5'
          python-version: '3.12'
      - run: uv sync --locked --extra server --extra logfire --extra postgres --extra sandbox --extra google --extra openai --extra anthropic --group dev
      - run: uv run --no-sync python scripts/check_onboarding.py --case offline
      # Guided Gateway checks include exporter failure boundaries, requiring the Logfire SDK.
      - run: uv run --no-sync python scripts/check_onboarding.py --case guided

  onboarding-artifacts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        artifact: [wheel, sdist]
        recipe: [base, google, openai, anthropic, analysis]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: '0.12.5'
          python-version: '3.12'
      - run: uv build
      - name: Install artifact with committed dependency resolution
        shell: bash
        env:
          RECIPE: ${{ matrix.recipe }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          extras=()
          case "$RECIPE" in
            google|openai|anthropic) extras=(--extra server --extra postgres --extra "$RECIPE") ;;
            analysis) extras=(--extra server --extra postgres --extra google --extra sandbox) ;;
          esac
          uv export --locked --no-dev --no-emit-project "${extras[@]}" -o /tmp/onboarding-requirements.txt
          uv venv /tmp/onboarding-artifact
          uv pip sync --python /tmp/onboarding-artifact/bin/python /tmp/onboarding-requirements.txt
          if [ "$ARTIFACT" = wheel ]; then
            artifact=(dist/*.whl)
          else
            artifact=(dist/*.tar.gz)
          fi
          uv pip install --python /tmp/onboarding-artifact/bin/python --no-deps "${artifact[0]}"
          cd /tmp
          /tmp/onboarding-artifact/bin/python "$GITHUB_WORKSPACE/scripts/check_onboarding.py" --case installed

  sandbox-platform:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: '0.12.5'
          python-version: '3.12'
      - run: uv sync --locked --extra sandbox --extra server --extra postgres --group dev
      - run: uv run pytest -q tests/test_sandbox_compatibility.py tests/test_sandbox_sql.py tests/test_sandbox_runner.py tests/test_sandbox_cancellation.py tests/test_sandbox_limits.py tests/test_sandbox_demo.py
  sandbox-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: '0.12.5'
          python-version: '3.12'
      - run: uv sync --locked --extra sandbox --extra server --extra postgres --group dev
      - run: uv run python scripts/sandbox_postgres_fixture.py
  base-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: '0.12.5'
          python-version: '3.12'
      - run: uv sync --locked --extra server --group dev
      - run: uv run pytest -q tests/test_sandbox_optional.py tests/test_runtime.py
