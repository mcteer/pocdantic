name: Quality gates
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.5'
      - run: uv sync --locked --extra server --extra logfire --extra postgres --group dev
      - run: python3 scripts/check_privacy.py --history
      - run: uv run python scripts/check_gates.py --all-features
      - run: uv run python scripts/check_gates.py --runtime-only
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - run: uv run agent validate run
      - run: uv run pytest -q tests/test_validation_runner.py::test_ten_repeatable_runs_under_budget tests/test_validation_report.py::test_ten_thousand_normalized_event_report_budget
      - run: uv run agent demo
      - run: uv build
      - run: uv run python scripts/check_distribution.py
